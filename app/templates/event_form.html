{% extends "base.html" %}

{% block content %}
<div class="mb-4">
    <h1 class="h2 mb-1">{{ form_heading }}</h1>

    <p class="text-muted">
        Complete all required event information.
    </p>
</div>

{% if errors %}
<div class="alert alert-danger">
    <p class="fw-semibold mb-2">
        Please correct the following:
    </p>

    <ul class="mb-0">
        {% for error in errors %}
        <li>{{ error }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}

<div class="card shadow-sm">
    <div class="card-body p-4">
        <form method="post" action="{{ form_action }}">
            <div class="row g-3">
                <div class="col-md-8">
                    <label for="title" class="form-label">
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        class="form-control"
                        value="{{ event.title }}"
                        required
                    >
                </div>

                <div class="col-md-4">
                    <label for="category" class="form-label">
                        Category
                    </label>

                    <input
                        type="text"
                        id="category"
                        name="category"
                        class="form-control"
                        value="{{ event.category }}"
                        placeholder="Workshop"
                        required
                    >
                </div>

                <div class="col-12">
                    <label for="description" class="form-label">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        class="form-control"
                        rows="4"
                        required
                    >{{ event.description }}</textarea>
                </div>

                <div class="col-12">
                    <label for="tags" class="form-label">
                        Tags
                    </label>

                    <input
                        type="text"
                        id="tags"
                        name="tags"
                        class="form-control"
                        value="{{ event.tagsText }}"
                        placeholder="MongoDB, NoSQL, Workshop"
                        required
                    >

                    <div class="form-text">
                        Separate tags using commas.
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="start_date" class="form-label">
                        Start date
                    </label>

                    <input
                        type="datetime-local"
                        id="start_date"
                        name="start_date"
                        class="form-control"
                        value="{{ event.startDateInput }}"
                        required
                    >
                </div>

                <div class="col-md-6">
                    <label for="end_date" class="form-label">
                        End date
                    </label>

                    <input
                        type="datetime-local"
                        id="end_date"
                        name="end_date"
                        class="form-control"
                        value="{{ event.endDateInput }}"
                        required
                    >
                </div>

                <div class="col-md-4">
                    <label for="capacity" class="form-label">
                        Capacity
                    </label>

                    <input
                        type="number"
                        id="capacity"
                        name="capacity"
                        class="form-control"
                        value="{{ event.capacity }}"
                        min="1"
                        required
                    >
                </div>

                <div class="col-md-8">
                    <label for="organizer_id" class="form-label">
                        Organizer
                    </label>

                    <select
                        id="organizer_id"
                        name="organizer_id"
                        class="form-select"
                        required
                    >
                        <option value="">Select an organizer</option>

                        {% for organizer in organizers %}
                        <option
                            value="{{ organizer._id }}"
                            {% if event.organizerId|string
                                == organizer._id|string %}
                                selected
                            {% endif %}
                        >
                            {{ organizer.firstName }}
                            {{ organizer.lastName }}
                            — {{ organizer.role }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-5">
                    <label for="building" class="form-label">
                        Building
                    </label>

                    <input
                        type="text"
                        id="building"
                        name="building"
                        class="form-control"
                        value="{{ event.building }}"
                        required
                    >
                </div>

                <div class="col-md-3">
                    <label for="room" class="form-label">
                        Room
                    </label>

                    <input
                        type="text"
                        id="room"
                        name="room"
                        class="form-control"
                        value="{{ event.room }}"
                        required
                    >
                </div>

                <div class="col-md-4">
                    <label for="address" class="form-label">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        name="address"
                        class="form-control"
                        value="{{ event.address }}"
                        required
                    >
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    {{ submit_label }}
                </button>

                <a href="/events" class="btn btn-outline-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
