{% extends "base.html" %}

{% block content %}
<div class="error-panel text-center">
    <p class="display-1 fw-bold text-primary mb-0">
        {{ status_code }}
    </p>

    <h1 class="h3 mb-3">{{ heading }}</h1>

    <p class="text-muted mb-4">
        {{ message }}

    <a href="/" class="btn btn-primary">
        Return to dashboard
    </a>
</div>
{% endblock %}
