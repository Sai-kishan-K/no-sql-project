<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {{ page_title }} | Campus Events Manager
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="{{ url_for('static', path='/css/style.css') }}"
        rel="stylesheet"
    >
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/">
                Campus Events Manager
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavigation"
                aria-controls="mainNavigation"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="mainNavigation"
            >
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a
                            class="nav-link
                            {% if active_page == 'dashboard' %}
                                active
                            {% endif %}"
                            href="/"
                        >
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link
                            {% if active_page == 'events' %}
                                active
                            {% endif %}"
                            href="/events"
                        >
                            Events
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link
                            {% if active_page == 'users' %}
                                active
                            {% endif %}"
                            href="/users"
                        >
                            Users
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link
                            {% if active_page == 'analytics' %}
                                active
                            {% endif %}"
                            href="/analytics"
                        >
                            Analytics
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="border-top bg-white py-3 mt-5">
        <div class="container text-center text-muted">
            Campus Events Manager — NoSQL Development Project
        </div>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    {% block scripts %}
    {% endblock %}
</body>
</html>
